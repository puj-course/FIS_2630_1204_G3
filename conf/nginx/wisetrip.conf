# Proxy inverso de WiseTrip (servicio "proxy" del docker-compose.yml).
# Recibe las peticiones en el puerto 80 del contenedor y las reenvia a la
# aplicacion por la red interna de Docker "wisetrip-red". El nombre "wisetrip"
# lo resuelve el DNS interno de Docker: es el nombre del servicio de la app.
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://wisetrip:8090;

        # Host con puerto (si PROXY_PUERTO no es 80) para que las redirecciones de
        # Spring (por ejemplo a /login) vuelvan al proxy y no al 8090
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
