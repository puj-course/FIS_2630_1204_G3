# =============================================================================
# Pruebas unitarias
# Corre todas las pruebas JUnit en cada rama del Gitflow y genera un informe
# que cruza cada caso del plan de pruebas (CP01..CP57) con su resultado real.
# =============================================================================
name: Pruebas unitarias

# Gitflow: se ejecuta en las ramas de integración y en cada rama de trabajo,
# y en los pull requests hacia main y develop.
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'    # ramas de funcionalidades
      - 'features-*'    # ramas personales del equipo (features-santiago, ...)
      - 'release/**'
      - 'hotfix/**'
  pull_request:          # un PR a main/develop no se fusiona tranquilo si esto falla
    branches:
      - main
      - develop
jobs:
  pruebas:
    name: JUnit + informe
    runs-on: ubuntu-latest   # maquina virtual Linux limpia que da GitHub

    steps:
      # Descarga el codigo (accion fijada por SHA por seguridad; comentario = version)
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Instala Java 25, la version del proyecto
      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 25
          distribution: zulu

      # Cache de dependencias de Maven: si el pom.xml no cambia, no se descargan otra vez
      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # verify = compilar + correr las pruebas (Surefire) + cobertura (JaCoCo).
      # Si una prueba falla, este paso falla y el check queda en rojo.
      - name: Ejecutar pruebas unitarias
        run: mvn -B -f app/Entrega1/wisetrip_entrega1/pom.xml verify

      # Lee los XML de Surefire, busca "cpNN" en el nombre de cada prueba y lo
      # cruza con docs/pruebas/plan_pruebas.json. Genera HTML/JSON y un resumen
      # en la pestana Summary del run.
      # always(): se ejecuta aunque las pruebas hayan fallado, para ver cuales.
      - name: Generar informe de pruebas (alineado con el plan)
        if: always()
        run: python3 .github/scripts/informe_pruebas.py

      # Deja descargables: el informe del plan, los reportes de Surefire y la
      # cobertura de JaCoCo (abrir target/site/jacoco/index.html).
      - name: Publicar informe como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pruebas
          path: |
            app/Entrega1/wisetrip_entrega1/target/informe-pruebas/
            app/Entrega1/wisetrip_entrega1/target/surefire-reports/
            app/Entrega1/wisetrip_entrega1/target/site/jacoco/
