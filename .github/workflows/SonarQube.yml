# =============================================================================
# SonarQube (SonarCloud)
# Analiza la calidad del codigo Java: cobertura de pruebas, bugs,
# vulnerabilidades, code smells y duplicacion. Da un Quality Gate
# (aprobado / no aprobado) y lo comenta en los pull requests.
# =============================================================================
name: SonarQube

on:
  push:
    branches:
      - main              # analiza main despues de cada merge
  pull_request:           # analiza cada PR para frenar codigo de baja calidad
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 descarga TODO el historial de git: Sonar lo necesita
      # para saber que codigo es nuevo (el Quality Gate mide el "new code")
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # Java 25, la version del proyecto
      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 25
          distribution: zulu

      # Cache de los paquetes del analizador de Sonar
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Cache de dependencias de Maven
      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Falla rapido y claro si alguien movio la carpeta del proyecto
      - name: Verificar ubicación del POM
        run: test -f app/Entrega1/wisetrip_entrega1/pom.xml

      # verify: corre las pruebas y JaCoCo genera target/site/jacoco/jacoco.xml
      # sonar:  envia codigo + cobertura a SonarCloud
      # SONAR_TOKEN es un secreto del repositorio (GitHub lo oculta como ***).
      # Que se analiza y que se excluye esta en las propiedades sonar.* del pom.xml.
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B
          -f app/Entrega1/wisetrip_entrega1/pom.xml
          verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=puj-course_FIS_2630_1204_G3
          -Dsonar.organization=puj-course
          -Dsonar.host.url=https://sonarcloud.io
