name: Docker CI/CD

# Construye el proyecto, construye la imagen Docker, la despliega con
# Docker Compose (app + proxy Nginx en la red wisetrip-red), comprueba que
# responda y publica la imagen en DockerHub.
on:
  push:
    branches:
      - main
      - develop
      - 'feature/docker-deploy'
      - 'feature/docker-compose-red'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

env:
  APP_DIR: app/Entrega1/wisetrip_entrega1
  IMAGEN: wisetrip

jobs:
  # ---------------------------------------------------------------- 1. Maven
  build-y-pruebas:
    name: Build y pruebas (Maven)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configurar JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 25
          distribution: zulu

      - name: Cache de Maven
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Compilar, probar y empaquetar el .war
        run: mvn -B -f ${{ env.APP_DIR }}/pom.xml verify

      - name: Guardar el .war como artefacto del workflow
        uses: actions/upload-artifact@v4
        with:
          name: wisetrip-war
          path: ${{ env.APP_DIR }}/target/*.war

  # ---------------------------------------------------------------- 2. Docker
  docker:
    name: Imagen Docker, prueba de humo y publicacion
    needs: build-y-pruebas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir la imagen con el Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGEN }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Desplegar con Docker Compose (app + proxy en la red wisetrip-red)
        run: |
          # Compose usa la imagen recien construida en vez de construirla otra vez
          docker tag ${{ env.IMAGEN }}:ci ${{ env.IMAGEN }}:latest
          # --wait espera a que los healthchecks de los dos servicios digan "healthy"
          docker compose up -d --no-build --wait --wait-timeout 180
          docker compose ps

      - name: Verificar la red Docker entre servicios
        run: |
          docker network ls --filter name=wisetrip-red
          echo "Contenedores conectados a wisetrip-red:"
          docker network inspect wisetrip-red --format '{{range .Containers}}{{.Name}} -> {{.IPv4Address}}{{println}}{{end}}'
          # El proxy llega a la app por el nombre del servicio (DNS interno de Docker)
          docker compose exec -T proxy wget -q -O /dev/null http://wisetrip:8090/
          echo "proxy -> http://wisetrip:8090 por la red interna: OK"

      - name: Prueba de humo (directo en 8090 y a traves del proxy en 80)
        run: |
          curl -fsS -o /dev/null -w "Directo  http://localhost:8090 -> HTTP %{http_code}\n" http://localhost:8090/
          curl -fsS -o /dev/null -w "Proxy    http://localhost      -> HTTP %{http_code}\n" http://localhost/

      - name: Logs de los contenedores (solo si algo fallo)
        if: failure()
        run: docker compose logs

      - name: Apagar el despliegue de prueba
        if: always()
        run: docker compose down

      - name: Iniciar sesion en DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar la imagen en DockerHub (latest y hash del commit)
        if: github.event_name == 'push'
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGEN }}"
          SHA_CORTO="${GITHUB_SHA::7}"
          docker tag ${{ env.IMAGEN }}:ci "$REPO:latest"
          docker tag ${{ env.IMAGEN }}:ci "$REPO:$SHA_CORTO"
          docker push "$REPO:latest"
          docker push "$REPO:$SHA_CORTO"
          echo "Publicada: $REPO:latest y $REPO:$SHA_CORTO"
          # Version semantica: al subir un tag de git (v1.0.0) tambien se publica con ese nombre
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            docker tag ${{ env.IMAGEN }}:ci "$REPO:$GITHUB_REF_NAME"
            docker push "$REPO:$GITHUB_REF_NAME"
            echo "Publicada: $REPO:$GITHUB_REF_NAME"
          fi
